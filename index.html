<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MotoMap</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,sans-serif; background:#0f0f0f; color:#fff; padding:20px; min-height:100vh; }
  h1 { font-size:22px; font-weight:600; margin-bottom:20px; }
  .card { background:#1c1c1e; border-radius:16px; padding:16px; margin-bottom:16px; }
  label { font-size:13px; color:#8e8e93; margin-bottom:6px; display:block; }
  input { width:100%; padding:12px 14px; background:#2c2c2e; border:none; border-radius:10px; color:#fff; font-size:16px; outline:none; }
  input::placeholder { color:#555; }
  #suggestions { background:#2c2c2e; border-radius:10px; margin-top:6px; overflow:hidden; display:none; }
  .sug { padding:12px 14px; font-size:14px; border-bottom:1px solid #3a3a3c; cursor:pointer; }
  .sug:last-child { border-bottom:none; }
  .sug:active { background:#3a3a3c; }
  .sug-name { font-weight:500; }
  .sug-addr { font-size:12px; color:#8e8e93; margin-top:2px; }
  .btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; margin-top:12px; }
  .blue { background:#0a84ff; color:#fff; }
  .red  { background:#ff3b30; color:#fff; }
  .loading { text-align:center; padding:16px; display:none; }
  .spinner { display:inline-block; width:22px; height:22px; border:3px solid #3a3a3c; border-top-color:#0a84ff; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #nav { display:none; }
  .dir { text-align:center; padding:24px 0; }
  .arrow { font-size:72px; line-height:1; }
  .dtxt  { font-size:24px; font-weight:700; margin-top:8px; }
  .ddist { font-size:16px; color:#8e8e93; margin-top:4px; }
  .dname { font-size:13px; color:#8e8e93; margin-top:4px; font-style:italic; }
  .progress-wrap { background:#2c2c2e; border-radius:4px; height:4px; margin-top:12px; }
  .progress-bar  { background:#0a84ff; height:4px; border-radius:4px; width:0%; transition:width .5s; }
  .srow { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid #2c2c2e; margin-top:10px; font-size:13px; color:#8e8e93; }
  .dot  { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  .g{background:#30d158;} .r{background:#ff3b30;} .y{background:#ffd60a;}
  #log { font-size:12px; color:#8e8e93; max-height:80px; overflow-y:auto; font-family:monospace; line-height:1.6; }
</style>
</head>
<body>

<h1>🏍️ MotoMap</h1>

<div class="card" id="search-panel">
  <label>Điểm đến</label>
  <input type="text" id="dest" placeholder="Nhập địa chỉ..." oninput="onSearch(this.value)" autocomplete="off">
  <div id="suggestions"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="margin-top:8px;font-size:14px;color:#8e8e93">Đang tải route...</p>
  </div>
  <button class="btn blue" onclick="startNav()">🚀 Bắt đầu dẫn đường</button>
</div>

<div class="card" id="nav">
  <div class="dir">
    <div class="arrow" id="arr">⏳</div>
    <div class="dtxt"  id="dtxt">Đang xác định...</div>
    <div class="ddist" id="ddist"></div>
    <div class="dname" id="dname"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progress"></div>
  </div>
  <p style="font-size:12px;color:#8e8e93;margin-top:6px;text-align:center">
    Bước <span id="wp-cur">0</span> / <span id="wp-total">0</span>
  </p>
  <div class="srow">
    <span><span class="dot y" id="gps-dot"></span><span id="gps-lbl">GPS...</span></span>
    <span><span class="dot y" id="ts-dot"></span><span id="ts-lbl">ThingSpeak...</span></span>
  </div>
  <button class="btn red" onclick="stopNav()">⏹ Dừng</button>
</div>

<div class="card">
  <label>Log</label>
  <div id="log">Chờ bắt đầu...</div>
</div>

<script>
// ================================================================
// ⚠️  ĐIỀN TOKEN MAPBOX VÀO ĐÂY (BẮT ĐẦU BẰNG pk.)
// ================================================================
const MAPBOX_KEY   = "pk.eyJ1IjoicGhvbmdsZTI3MDEiLCJhIjoiY21vMW8xY2JpMGtwZTJvcHN3ZzE3YmFqNyJ9.BACL5pm3juXEOssFS33i0g"; 
const TS_WRITE_KEY = "451JPB1YWXNVYFEB";            
const TS_CHANNEL   = "2513426";                     

const THRESHOLD = 30; 
let waypoints=[], wpIdx=0, watchId=null, destCoord=null, searchTimer=null, lastSentKey='';

function log(msg) {
  const t = new Date().toLocaleTimeString('vi');
  const el = document.getElementById('log');
  el.innerHTML = `[${t}] ${msg}<br>` + el.innerHTML;
}
function dot(id, c) { document.getElementById(id).className = 'dot ' + c; }

// ================================================================
// MAPBOX GEOCODING (TÌM ĐỊA CHỈ)
// ================================================================
function onSearch(val) {
  clearTimeout(searchTimer);
  document.getElementById('suggestions').style.display = 'none';
  if (val.length < 2) return;

  searchTimer = setTimeout(async () => {
    try {
      const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(val)}.json?access_token=${MAPBOX_KEY}&country=vn&autocomplete=true&limit=5`;
      const data = await (await fetch(url)).json();
      showSug(data.features || []);
    } catch(e) { log('Lỗi tìm kiếm: ' + e.message); }
  }, 400);
}

function showSug(list) {
  const box = document.getElementById('suggestions');
  if (!list.length) { box.style.display='none'; return; }
  box.innerHTML = list.map(f => {
    const main = f.text;
    const sec = f.place_name.replace(main + ', ', ''); 
    // Mapbox trả về tọa độ [Kinh độ, Vĩ độ] 
    return `<div class="sug" onclick="pick(${f.center[1]}, ${f.center[0]}, '${f.place_name.replace(/'/g,"\\'")}')">
      <div class="sug-name">${main}</div>
      <div class="sug-addr">${sec}</div>
    </div>`;
  }).join('');
  box.style.display = 'block';
}

function pick(lat, lon, fullAddr) {
  document.getElementById('dest').value = fullAddr;
  document.getElementById('suggestions').style.display = 'none';
  destCoord = { lat: lat, lon: lon };
  log(`Đã chọn: ${fullAddr.split(',')[0]} → ${lat.toFixed(4)}, ${lon.toFixed(4)}`);
}

// ================================================================
// MAPBOX DIRECTIONS (TÍNH ĐƯỜNG)
// ================================================================
async function getRoute(fLat, fLon, tLat, tLon) {
  // Lưu ý: Mapbox dùng định dạng Kinh Độ, Vĩ Độ (Lon, Lat)
  const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${fLon},${fLat};${tLon},${tLat}?steps=true&language=vi&access_token=${MAPBOX_KEY}`;
  const data = await (await fetch(url)).json();

  if (!data.routes?.length) throw new Error('Không tìm được route');

  const steps = data.routes[0].legs[0].steps;
  const wps = steps.map(s => ({
    lat:    s.maneuver.location[1], 
    lon:    s.maneuver.location[0],
    action: parseMapboxManeuver(s.maneuver),
    dist:   Math.round(s.distance || 0),
    name:   s.maneuver.instruction || '',
  }));

  const km = (data.routes[0].distance / 1000).toFixed(1);
  log(`Route OK: ${wps.length} bước, ${km}km`);
  return wps;
}

// Giải mã logic của Mapbox sang chuẩn mà ESP32 của bạn đang xài
function parseMapboxManeuver(maneuver) {
  const type = maneuver.type; 
  const mod = maneuver.modifier; 

  if (type === 'arrive') return 'arrived';
  if (type === 'roundabout') return 'roundabout';
  
  if (mod) {
    if (mod.includes('left')) return 'turn_left';
    if (mod.includes('right')) return 'turn_right';
    if (mod.includes('uturn')) return 'u_turn';
  }
  return 'straight'; // Mặc định đi thẳng
}

// ================================================================
// ĐIỀU HƯỚNG & GPS (GIỮ NGUYÊN CODE CỦA BẠN VÌ ĐÃ RẤT TỐT)
// ================================================================
async function startNav() {
  if (!destCoord) { alert('Hãy chọn địa chỉ từ danh sách gợi ý!'); return; }

  document.getElementById('loading').style.display = 'block';
  dot('gps-dot','y');
  document.getElementById('gps-lbl').textContent = 'Đang lấy GPS...';

  navigator.geolocation.getCurrentPosition(async pos => {
    dot('gps-dot','g');
    document.getElementById('gps-lbl').textContent = 'GPS OK';
    log(`GPS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)} ±${Math.round(pos.coords.accuracy)}m`);

    try {
      waypoints = await getRoute(
        pos.coords.latitude, pos.coords.longitude,
        destCoord.lat, destCoord.lon
      );
    } catch(e) {
      log('Lỗi route: ' + e.message);
      document.getElementById('loading').style.display = 'none';
      return;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('search-panel').style.display = 'none';
    document.getElementById('nav').style.display = 'block';
    document.getElementById('wp-total').textContent = waypoints.length;

    wpIdx = 0; lastSentKey = '';
    updateProgress();

    const first = waypoints[0];
    updateUI(first.action, first.dist, first.name);
    await sendToThingSpeak(first.action, first.dist);

    watchId = navigator.geolocation.watchPosition(onGPS, onGPSErr, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 8000,
    });
    log('Bắt đầu dẫn đường!');

  }, err => {
    document.getElementById('loading').style.display = 'none';
    onGPSErr(err);
  }, { enableHighAccuracy:true, timeout:10000 });
}

function stopNav() {
  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  document.getElementById('search-panel').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
  sendToThingSpeak('waiting', 0);
  log('Đã dừng.');
}

function onGPS(pos) {
  const { latitude:lat, longitude:lon, accuracy:acc } = pos.coords;
  dot('gps-dot', acc < 20 ? 'g' : 'y');
  document.getElementById('gps-lbl').textContent = `±${Math.round(acc)}m`;

  if (wpIdx >= waypoints.length) return;

  const wp   = waypoints[wpIdx];
  const dist = haversine(lat, lon, wp.lat, wp.lon);
  const next = waypoints[Math.min(wpIdx + 1, waypoints.length - 1)];

  updateUI(next.action, dist, next.name);

  const key = next.action + Math.round(dist / 50);
  if (key !== lastSentKey) {
    sendToThingSpeak(next.action, dist);
    lastSentKey = key;
  }

  if (dist < THRESHOLD) {
    log(`✓ Waypoint ${wpIdx + 1}/${waypoints.length}`);
    wpIdx++;
    updateProgress();

    if (wpIdx >= waypoints.length) {
      updateUI('arrived', 0, 'Đã đến điểm đến!');
      sendToThingSpeak('arrived', 0);
      log('🎯 ĐÃ ĐẾN NƠI!');
      navigator.geolocation.clearWatch(watchId);
    }
  }
}

function onGPSErr(e) { dot('gps-dot','r'); log('GPS lỗi: ' + e.message); }

let lastSendTime = 0;
async function sendToThingSpeak(action, distance) {
  const now = Date.now();
  if (now - lastSendTime < 3000) return;
  lastSendTime = now;

  const msg = `${action}|${Math.round(distance)}`;
  const url = `https://api.thingspeak.com/update?api_key=${TS_WRITE_KEY}&field1=${encodeURIComponent(msg)}`;

  try {
    await fetch(url, { mode: 'no-cors' });
    dot('ts-dot','g');
    document.getElementById('ts-lbl').textContent = action;
    log(`→ ThingSpeak: ${msg}`);
  } catch {
    dot('ts-dot','r');
    document.getElementById('ts-lbl').textContent = 'Lỗi';
  }
}

const ARROWS = {
  straight:   ['⬆️','Đi thẳng'],
  turn_left:  ['⬅️','Rẽ trái'],
  turn_right: ['➡️','Rẽ phải'],
  u_turn:     ['↩️','Quay đầu'],
  roundabout: ['🔄','Vào vòng xoay'],
  arrived:    ['🎯','Đã đến nơi!'],
  waiting:    ['🧭','Chờ bắt đầu...'],
};

function updateUI(action, dist, name) {
  const [emoji, text] = ARROWS[action] || ARROWS.straight;
  document.getElementById('arr').textContent   = emoji;
  document.getElementById('dtxt').textContent  = text;
  document.getElementById('ddist').textContent = dist > 0 ? `còn ${fmt(dist)}` : '';
  document.getElementById('dname').textContent = name || '';
}

function updateProgress() {
  const pct = waypoints.length ? (wpIdx / waypoints.length * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('wp-cur').textContent = wpIdx;
}

function fmt(m) { return m >= 1000 ? (m/1000).toFixed(1)+' km' : Math.round(m)+' m'; }

function haversine(la1,lo1,la2,lo2) {
  const R=6371000, f1=la1*Math.PI/180, f2=la2*Math.PI/180;
  const df=(la2-la1)*Math.PI/180, dl=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
</script>
</body>
</html>
